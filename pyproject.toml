[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raglab"
version = "7.0.0a0"
description = "RAGLab — Advanced RAG Pipeline with Scientific Evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

# Dependencies will be added in Slice 1 with lockfile and hashes.
# No external dependencies are installed in Slice 0.
dependencies = []

[project.optional-dependencies]
dev = []
# dev dependencies (pytest, ruff, mypy) will be added in Slice 1

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.mypy]
python_version = "3.10"
strict = true
