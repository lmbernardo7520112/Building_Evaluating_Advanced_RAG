name: RAGLab CI — Preservation + Quality Gate 1

on:
  push:
    branches: ['feat/raglab-v7-evolution']
  pull_request:
    branches: ['main', 'feat/raglab-v7-evolution']

permissions:
  contents: read

jobs:
  preservation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify v6.1 reference integrity
        run: python3 scripts/verify_reference.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan for secrets
        run: python3 scripts/scan_secrets.py

  quality-gate-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff lint
        run: ruff check src/ tests/

      - name: Run mypy type check
        run: mypy src/

      - name: Run pytest test suite with coverage
        run: pytest --cov=src/raglab --cov-report=term-missing tests/

      - name: Run CLI smoke test
        run: raglab smoke

  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify minimum structure
        run: |
          echo "Checking required files..."
          required_files=(
            "reference/source_manifest.json"
            "reference/v6_1_reference.ipynb"
            "scripts/verify_reference.py"
            "scripts/scan_secrets.py"
            ".agents/rules/authorization.md"
            ".gitignore"
            "README.md"
            "src/raglab/__init__.py"
            "src/raglab/domain/entities.py"
            "src/raglab/domain/value_objects.py"
            "src/raglab/domain/enums.py"
            "src/raglab/domain/errors.py"
            "src/raglab/domain/policies.py"
            "src/raglab/domain/metrics.py"
            "src/raglab/application/ports/corpus.py"
            "src/raglab/application/ports/retrieval.py"
            "src/raglab/application/ports/generation.py"
            "src/raglab/application/ports/evaluation.py"
            "src/raglab/application/ports/checkpoints.py"
            "src/raglab/infrastructure/config/settings.py"
            "src/raglab/infrastructure/retrieval/baseline_adapter.py"
            "src/raglab/infrastructure/persistence/checkpoint_store.py"
            "src/raglab/interfaces/cli/main.py"
            "data/tiny_corpus/corpus.json"
            "data/tiny_corpus/manifest.json"
            "requirements.lock"
            "sbom.cyclonedx.json"
            "docs/security/threat_model.md"
            "docs/supply_chain.md"
          )
          all_ok=true
          for f in "${required_files[@]}"; do
            if [ -f "$f" ]; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f"
              all_ok=false
            fi
          done
          if [ "$all_ok" = false ]; then
            exit 1
          fi
          echo "All required files present"
